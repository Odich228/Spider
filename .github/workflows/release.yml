name: Verify, build and release
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Finish each main push, rather than cancelling a release half-way through.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  CI: 'true'

jobs:
  verify:
    name: Analyze and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-flutter
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: dart run build_runner build
      - run: git diff --exit-code -- lib/core/database/app_database.g.dart
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage
      - run: python3 -m unittest discover -s tool/ci/tests -v

  database:
    name: Database ownership and sync protocol
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pautina_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Apply production migration to PostgreSQL and test its access rules
        env:
          PGPASSWORD: postgres
        run: >-
          psql -h localhost -U postgres -d pautina_test -v ON_ERROR_STOP=1
          -f tool/sql/test_bootstrap.sql
          -f supabase/migrations/202610260001_library.sql
          -f supabase/tests/library.sql

  build:
    name: Build ${{ matrix.platform }}
    needs: [verify, database]
    # Pull requests run the tests above; main pushes build all four targets.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-24.04
          - platform: windows
            runner: windows-2022
          - platform: macos
            runner: macos-15
          - platform: ios
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-flutter
      - name: Build and package
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          IOS_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD }}
        run: python tool/ci/build.py --platform ${{ matrix.platform }} --build-number ${{ github.run_number }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Validate artifact set and generate checksums and release notes
        run: python3 tool/ci/release.py --directory dist --number ${{ github.run_number }} --commit ${{ github.sha }}
      - name: Publish all four platform artifacts atomically
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(python3 -c "import json; print(json.load(open('dist/release.json'))['tag'])")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "Release $TAG is already published."
              exit 0
            fi
            gh release edit "$TAG" --notes-file dist/RELEASE-NOTES.md
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Паутина $TAG" --notes-file dist/RELEASE-NOTES.md --prerelease --draft
          fi
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --draft=false
